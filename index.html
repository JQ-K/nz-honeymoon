<style>
:root{--bg:#eef3f2;--card:#ffffff;--fg:#17231f;--muted:#5d6d68;--line:#d3dedb;--accent:#0b7480;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1716;--card:#16211f;--fg:#e4ecea;--muted:#93a59f;--line:#2a3833;--accent:#4cc0c9;--err:#f08a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
  font:15px/1.6 "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
form{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font:600 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--accent)}
h1{font:700 26px/1.3 "Songti SC","Noto Serif SC",serif;margin:0}
p{margin:0;color:var(--muted)}
input[type=password]{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.rem{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
button{font:600 16px/1 inherit;padding:14px;border:0;border-radius:10px;background:var(--fg);color:var(--card);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.4em;font-size:13px;color:var(--err)}
</style>

const KEY = "nz-trip-pw";
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(P.i)}, key, u8(P.c)));
  document.open(); document.write(html); document.close();
}
const f = document.getElementById("f"), go = document.getElementById("go"), msg = document.getElementById("msg");
f.addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  go.disabled = true; go.textContent = "正在解锁…"; msg.textContent = "";
  try {
    if (document.getElementById("rem").checked) { try { localStorage.setItem(KEY, pw); } catch(_){} }
    await open(pw);
  } catch(_) {
    try { localStorage.removeItem(KEY); } catch(_){}
    go.disabled = false; go.textContent = "查看行程";
    msg.textContent = window.crypto && crypto.subtle ? "密码不对，再试一次。" : "这个浏览器不支持解密，请换用 Safari 或 Chrome 打开 https 链接。";
  }
});
let saved = null; try { saved = localStorage.getItem(KEY); } catch(_){}
if (saved) open(saved).catch(() => { try { localStorage.removeItem(KEY); } catch(_){} });
})();
